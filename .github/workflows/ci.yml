name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # The frontend gate. Until this wave it ran `bun run build` and NOTHING else:
  # no unit tests, no lint, no size budget, no e2e — grepping the workflows for
  # `test:unit` / `perf:size` / `test:e2e` / `eslint` returned nothing at all.
  # The only thing CI could catch was a file that would not compile, which is
  # how fifteen deterministic e2e failures and a red-by-default smoke suite
  # accumulated without anyone seeing them.
  web:
    name: web (build + unit + size + lint)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.10
      - uses: actions/cache@v4
        with:
          path: web/node_modules
          key: ${{ runner.os }}-bun-${{ hashFiles('web/bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-
      - run: bun install --frozen-lockfile
      # `build` is `tsc -b && vite build`, so this is the typecheck too.
      - run: bun run build
      # The performance budgets (entry chunk, app JS, CSS) plus the non-gating
      # cold-load hero-path report. It reads `dist/`, so it must follow build.
      - name: Performance budget
        run: bun run perf:size
      # After build on purpose: `sw-navigation-route.test.ts` greps the EMITTED
      # service worker, which is the only place the precache-navigation hazard
      # is observable.
      - name: Unit tests
        run: bun test tests/unit --timeout 15000
      # Gated on the error COUNT, not on zero — see scripts/lint-gate.mjs for
      # why a gate that cannot pass on day one is worse than none.
      - name: ESLint (no new errors)
        run: bun run lint:gate

  # ── e2e: one binary, four shards ───────────────────────────────────────────
  #
  # The smoke suite boots a real supermux-server per TEST, so it is dominated by
  # boot cost (~20s each) and cannot use more than one worker on a machine (tmux
  # panes and ports are shared state — that is why `workers: 1` is in
  # playwright.config.ts and must stay there). The two things that WERE wasted
  # are fixed here:
  #
  #   1. the cargo build was inside the e2e job, so any parallelism across specs
  #      would have paid for it once per runner. It is now its own job, built
  #      once, and handed to the shards as an artifact (~25 MB, seconds to
  #      download) — the shards need no rust toolchain and no cargo cache at all;
  #   2. the suite ran as a single ~25-minute serial job. It now runs as four
  #      shards on four runners, each with its own binary and its own `workers:
  #      1`, so the critical path is the build plus the slowest QUARTER of the
  #      suite (~7m) instead of build + 25m.
  #
  # FOUR, not five. Playwright shards by spec FILE, and this suite's files are
  # lumpy (one holds 6 tests, most hold 1). Measured `--list --shard=i/N` on the
  # 73 CI-eligible tests: N=4 gives 19/19/17/18, N=5 gives 20/16/15/14/8 — a
  # fifth runner makes the WORST shard bigger and leaves one nearly idle, so it
  # is slower and costs a machine. Re-measure before changing N.
  #
  # Past that, each shard carries ~1.5-2m of fixed cost (checkout, bun, the
  # artifact, deps, browsers) that does not shard at all. That, not the shard
  # count, is the remaining lever — which is why the browser download is cached.
  #
  # `fail-fast: false` on purpose: one shard going red must not hide the other
  # three, or a "fix" gets shipped against a partial picture.
  build-server:
    name: server binary (debug, shared by the e2e shards)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable branch
        with:
          toolchain: stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            server/target
          key: ${{ runner.os }}-cargo-e2e-${{ hashFiles('server/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-e2e-
            ${{ runner.os }}-cargo-
      # The harness boots `server/target/debug/supermux-server`. Debug only —
      # CLAUDE.md forbids --release. No web bundle is embedded on purpose: the
      # harness serves the app from Vite, not from the binary's static assets.
      - name: Build the server binary
        working-directory: server
        run: cargo build --bin supermux-server
      - uses: actions/upload-artifact@v4
        with:
          name: supermux-server-debug
          path: server/target/debug/supermux-server
          retention-days: 1
          # The binary is the whole point; a silent empty upload would turn into
          # four confusing "binary not found" shards.
          if-no-files-found: error

  e2e:
    name: e2e (smoke ${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    needs: build-server
    # One shard is roughly a quarter of a ~25m suite; the headroom is for a cold
    # Playwright browser download and the artifact fetch.
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.10
      # Artifacts do not preserve the executable bit, so restore it explicitly —
      # otherwise every spec fails at spawn with EACCES.
      - uses: actions/download-artifact@v4
        with:
          name: supermux-server-debug
          path: server/target/debug
      - name: Make the server binary executable
        run: chmod +x server/target/debug/supermux-server
      - uses: actions/cache@v4
        with:
          path: web/node_modules
          key: ${{ runner.os }}-bun-${{ hashFiles('web/bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-
      - name: Install web deps
        working-directory: web
        run: bun install --frozen-lockfile
      # Two browser downloads on five runners is the largest remaining fixed cost,
      # and it only changes when Playwright does — so key the cache on the lockfile.
      # A miss is harmless: `playwright install` simply downloads as before.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('web/bun.lock') }}
          restore-keys: ${{ runner.os }}-playwright-
      # `chromium-headless-shell` is a SEPARATE browser download from `chromium`;
      # `sw-lifecycle.spec.ts` pins that channel on purpose (the badge crash it
      # guards reproduces only there — full chromium has the BadgeService binder).
      # `--with-deps` still runs (it installs apt libraries, which the cache above
      # does not cover); the cache saves the browser payloads themselves.
      - name: Install Playwright chromium
        working-directory: web
        run: bun x playwright install --with-deps chromium chromium-headless-shell
      # `@slow` and `@needs-claude` are excluded, and the reason is a property of
      # the runner rather than of the specs: both classes need the real `claude`
      # CLI on PATH (and, for `@slow`, authenticated). `delegate-handoff.spec.ts`
      # (`@slow`) drives TWO REAL Claude sessions through a full turn; the
      # `@needs-claude` resume specs assert an actual `claude --resume <id>`
      # launch. A hosted GitHub runner has no `claude`, so these could only ever
      # be red here — and a permanently-red job is the thing this whole commit
      # exists to stop. They all still run in the un-filtered `bun run
      # test:e2e:smoke` on a developer machine, which is where they can pass.
      #
      # Measured split of the 73 eligible tests: 19 / 19 / 17 / 18. Retries are no
      # longer global — see playwright.config.ts.
      - name: Smoke suite (shard ${{ matrix.shard }}/4)
        working-directory: web
        run: bun x playwright test tests/e2e/smoke --shard=${{ matrix.shard }}/4 --grep-invert "@slow|@needs-claude"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          # Per-shard name: four jobs uploading `playwright-report` would collide.
          name: playwright-report-shard-${{ matrix.shard }}
          path: |
            web/test-results
            web/playwright-report
          retention-days: 7

  server:
    name: server (cargo check + test)
    runs-on: ubuntu-latest
    # A cold debug build (check ~5m + test-compile ~3.5m) plus the test run can
    # exceed 10m on a cache miss, which cancels the gating job mid-`cargo test`.
    # Give headroom. Debug only — CLAUDE.md forbids --release (OOM on small hosts).
    #
    # This job deliberately does NOT consume `build-server`'s artifact. That
    # artifact is one binary with no web bundle embedded; this job needs every
    # `--all-targets` object and ~40 test binaries, compiled against a
    # server/static that rust-embed reads at compile time. There is nothing to
    # reuse, so it keeps its own cache and its own build.
    timeout-minutes: 20
    env:
      # Drop debug info on the dev profile so the lld link of the many
      # integration test binaries fits in the runner's memory ceiling. Without
      # this, the link of e.g. `status_detector` SIGBUSes (`ld: signal 7`) on
      # GitHub-hosted ubuntu-latest. Tests still run + pass; we only lose
      # file:line in panic backtraces in CI logs, which is fine.
      CARGO_PROFILE_DEV_DEBUG: "0"
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      # tests/static_assets.rs exercises the SPA the binary actually serves, so the
      # web bundle must be built and embedded (rust-embed reads server/static at
      # compile time) BEFORE the cargo steps — mirrors scripts/build.sh's embed step.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.10
      - name: Build + embed web bundle
        working-directory: web
        run: |
          bun install --frozen-lockfile
          bun run build
          rm -rf ../server/static && cp -r dist ../server/static
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable branch
        with:
          toolchain: stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            server/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('server/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-
      # Debug builds only — CLAUDE.md forbids --release in CI (OOM risk on
      # small hosts and the published binary is built natively by deploy.sh).
      - run: cargo check --all-targets
      - run: cargo test --no-run
      - run: cargo test

  fmt:
    name: fmt (rustfmt, advisory)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable branch
        with:
          toolchain: stable
          components: rustfmt
      # Advisory only (non-blocking). The codebase is intentionally hand-formatted
      # in a compact style that diverges from stable rustfmt across ~150 files;
      # adopting rustfmt wholesale is a separate, deliberate decision. This step
      # still runs and prints the diff for reference, but a mismatch must NOT fail
      # CI or block merges.
      - run: cargo fmt --all -- --check
        continue-on-error: true
